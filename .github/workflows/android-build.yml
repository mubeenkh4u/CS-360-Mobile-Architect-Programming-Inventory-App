name: Build AWi&k APK

on:
  push:
    branches:
      - feature/khata-system
    paths-ignore:
      - "Project-Files/**"
      - "Builds/**"
      - "*.docx"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Write access is required only so successful signed push builds can archive the
# distributable APK under Builds/. Pull-request runs never execute that step.
permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUWIRE_KEYSTORE_B64: ${{ secrets.AUWIRE_KEYSTORE_B64 }}
      AUWIRE_STORE_PASSWORD: ${{ secrets.AUWIRE_STORE_PASSWORD }}
      AUWIRE_KEY_ALIAS: ${{ secrets.AUWIRE_KEY_ALIAS }}
      AUWIRE_KEY_PASSWORD: ${{ secrets.AUWIRE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"

          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"

          SAFE_NAME="$(printf '%s' "$VERSION_NAME" | sed 's/[^A-Za-z0-9._-]/-/g')"

          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          ANDROID_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AWi-k-v${{ steps.app_version.outputs.safe_name }}-vc${{ steps.app_version.outputs.code }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Package local signing tools
        shell: bash
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signing-tools/lib
          cp "$BUILD_TOOLS/apksigner" signing-tools/
          cp "$BUILD_TOOLS/zipalign" signing-tools/
          cp "$BUILD_TOOLS/lib/apksigner.jar" signing-tools/lib/

      - name: Upload unsigned release APK
        if: env.AUWIRE_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: AWi-k-v${{ steps.app_version.outputs.safe_name }}-vc${{ steps.app_version.outputs.code }}-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signing tools
        if: env.AUWIRE_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tools
          path: signing-tools/
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release signing key
        if: env.AUWIRE_KEYSTORE_B64 != ''
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/auwire-release-key.jks"
          printf '%s' "$AUWIRE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "AUWIRE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Rebuild signed release APK
        if: env.AUWIRE_KEYSTORE_B64 != ''
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: env.AUWIRE_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: AWi-k-v${{ steps.app_version.outputs.safe_name }}-vc${{ steps.app_version.outputs.code }}-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Archive signed APK in repository
        id: archive_build
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/khata-system' && env.AUWIRE_KEYSTORE_B64 != ''
        shell: bash
        run: |
          echo "publish_release=false" >> "$GITHUB_OUTPUT"
          VERSION_NAME="${{ steps.app_version.outputs.name }}"
          VERSION_CODE="${{ steps.app_version.outputs.code }}"
          SAFE_NAME="${{ steps.app_version.outputs.safe_name }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          BUILD_DIR="Builds/v$SAFE_NAME"
          APK_NAME="AWi-k-v$SAFE_NAME-vc$VERSION_CODE-$SHORT_SHA-release.apk"
          CHECKSUM_NAME="$APK_NAME.sha256"
          INFO_NAME="AWi-k-v$SAFE_NAME-vc$VERSION_CODE-$SHORT_SHA-build.txt"

          mkdir -p "$BUILD_DIR"
          cp app/build/outputs/apk/release/app-release.apk "$BUILD_DIR/$APK_NAME"

          (
            cd "$BUILD_DIR"
            sha256sum "$APK_NAME" > "$CHECKSUM_NAME"
          )

          cat > "$BUILD_DIR/$INFO_NAME" <<EOF
          App: AWi&k
          Package: com.auwire.iamkhata
          Version name: $VERSION_NAME
          Version code: $VERSION_CODE
          Source commit: $GITHUB_SHA
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          APK: $APK_NAME
          EOF

          # Never attach an APK built from an older commit to a branch that has
          # already advanced while this workflow was running.
          git fetch origin feature/khata-system
          REMOTE_SHA="$(git rev-parse origin/feature/khata-system)"
          if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
            echo "Branch advanced from $GITHUB_SHA to $REMOTE_SHA; skipping repository archive and release."
            exit 0
          fi

          # The source commit is still current, so this exact signed build is
          # eligible to become the tagged GitHub Release.
          echo "publish_release=true" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$BUILD_DIR"

          if git diff --cached --quiet; then
            echo "No new build files to archive."
            exit 0
          fi

          git commit -m "Archive AWi&k v$VERSION_NAME build [skip ci]"
          git push origin HEAD:feature/khata-system


      - name: Publish tagged GitHub Release
        if: steps.archive_build.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION_NAME="${{ steps.app_version.outputs.name }}"
          VERSION_CODE="${{ steps.app_version.outputs.code }}"
          SAFE_NAME="${{ steps.app_version.outputs.safe_name }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          TAG="v$SAFE_NAME-vc$VERSION_CODE"
          RELEASE_TITLE="AWi&k v$VERSION_NAME (vc$VERSION_CODE)"
          BUILD_DIR="Builds/v$SAFE_NAME"
          APK_NAME="AWi-k-v$SAFE_NAME-vc$VERSION_CODE-$SHORT_SHA-release.apk"
          CHECKSUM_NAME="$APK_NAME.sha256"
          INFO_NAME="AWi-k-v$SAFE_NAME-vc$VERSION_CODE-$SHORT_SHA-build.txt"
          NOTES_FILE="$RUNNER_TEMP/awik-release-notes.md"

          APK_SHA256="$(awk '{print $1}' "$BUILD_DIR/$CHECKSUM_NAME")"

          cat > "$NOTES_FILE" <<EOF
          ## AWi&k $VERSION_NAME

          - **Package:** `com.auwire.iamkhata`
          - **Version name:** `$VERSION_NAME`
          - **Version code:** `$VERSION_CODE`
          - **Source commit:** `$GITHUB_SHA`
          - **APK SHA-256:** `$APK_SHA256`

          This release APK is signed with the permanent AWi&k release signing identity.
          EOF

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            REF_TYPE="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')"
            REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')"

            if [ "$REF_TYPE" = "tag" ]; then
              REF_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$REF_SHA" --jq '.object.sha')"
            fi

            if [ "$REF_SHA" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG already points to $REF_SHA, not $GITHUB_SHA."
              echo "Bump versionName/versionCode before publishing a different source commit."
              exit 1
            fi

            gh release upload "$TAG"               "$BUILD_DIR/$APK_NAME"               "$BUILD_DIR/$CHECKSUM_NAME"               "$BUILD_DIR/$INFO_NAME"               --repo "$GITHUB_REPOSITORY"               --clobber

            gh release edit "$TAG"               --repo "$GITHUB_REPOSITORY"               --title "$RELEASE_TITLE"               --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG"               "$BUILD_DIR/$APK_NAME"               "$BUILD_DIR/$CHECKSUM_NAME"               "$BUILD_DIR/$INFO_NAME"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "$RELEASE_TITLE"               --notes-file "$NOTES_FILE"               --latest
          fi
