name: Build Auwire APK

on:
  push:
    branches:
      - feature/khata-system
    paths-ignore:
      - "Project-Files/**"
      - "*.docx"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AUWIRE_KEYSTORE_B64: ${{ secrets.AUWIRE_KEYSTORE_B64 }}
      AUWIRE_STORE_PASSWORD: ${{ secrets.AUWIRE_STORE_PASSWORD }}
      AUWIRE_KEY_ALIAS: ${{ secrets.AUWIRE_KEY_ALIAS }}
      AUWIRE_KEY_PASSWORD: ${{ secrets.AUWIRE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          ANDROID_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Auwire-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare release signing key
        if: env.AUWIRE_KEYSTORE_B64 != ''
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/auwire-release-key.jks"
          printf '%s' "$AUWIRE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "AUWIRE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.AUWIRE_KEYSTORE_B64 != ''
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed release APK
        if: env.AUWIRE_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Auwire-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
